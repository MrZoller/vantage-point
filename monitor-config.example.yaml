# ============================================================
# Vantage Point config
# Two-input model: SUBJECT (the market) x ANCHOR (whose interests define relevance)
#
# Core idea: relevance is the RELATIONSHIP between a news item and the anchor's
# profile, not a property of the item itself. "Is this important?" has no answer
# in the abstract; "is this important to THIS anchor, in THIS market?" does.
#
# Lifecycle:
#   1. bootstrap -> reads seeds, deep-researches subject + anchor, writes the
#                   `derived` blocks below. Runs ONCE; refreshes occasionally.
#   2. review    -> a human edits/approves the derived blocks before monitoring
#                   trusts them. (This step is the biggest quality lever.)
#   3. monitor   -> cheap, frequent. Diffs new public signal against the profile
#                   + state, surfaces only what is NEW and RELEVANT.
#
# Re-pointing at a new market or stakeholder = swap `subject`/`anchor` and
# re-run bootstrap. That swap is the proof the thing is a platform, not a one-off.
# ============================================================

version: 1

# Which Claude model each agent runs on. bootstrap is infrequent and depth
# matters, so it's worth spending Opus there; monitor runs daily doing shallow
# scoring, so keep it cheap on Sonnet. Values may be aliases ("opus"/"sonnet")
# or full model IDs — what's accepted depends on your plan and Claude Code
# version. Remove or blank a key to fall back to the CLI default model.
models:
  bootstrap: opus     # infrequent; depth matters — spend here
  monitor:   sonnet   # daily, shallow scoring — keep it cheap
  # deepdive: opus    # OPTIONAL second pass, OFF by default. Uncomment to enable:
                      # investigate + corroborate the few highest-scoring items on a
                      # stronger model (see monitoring.deepdive_* and the README).
  # editor:   opus    # OPTIONAL final pass, OFF by default. Uncomment to enable:
                      # a dedicated editor curates + polishes the report before
                      # delivery (lead, order, cut, tighten) without adding facts or
                      # dropping citations. Runs only on days a report is delivered.

subject:
  name: "Mechanical & microbrand wristwatches"
  description: >
    The enthusiast watch market: new releases, microbrand drops, limited
    editions, and secondary-market / auction movement. Excludes smartwatches.
  # Trusted seeds. The agent EXPANDS outward from these; it does not treat them
  # as the whole map. A few good seeds sharply reduce drift and hallucination.
  seeds:
    - https://www.hodinkee.com
    - https://www.fratellowatches.com
    - https://www.wornandwound.com    # strong microbrand coverage
    - https://www.chrono24.com        # secondary-market pricing signal
  scope:
    in:  ["new releases", "microbrand drops", "limited editions",
          "notable auction results", "discontinuations", "price movement"]
    out: ["smartwatches", "fashion-brand quartz", "general lifestyle content"]
  # ---- populated by bootstrap, then human-edited. Tells `monitor` how the
  #      market is shaped and WHERE news tends to break first. ----
  derived:
    structure: null           # segments, price tiers, how the market is organized
    key_players: []           # brands/houses that matter, each with a one-line why
    news_sources: []          # RANKED list of where news actually breaks first
    event_taxonomy: []        # kinds of events worth noticing (release, reissue, ...)
    last_bootstrapped: null
    confidence_notes: null    # what the agent is sure of vs. guessing

anchor:
  # WHOSE interests define relevance. Org, individual, or persona.
  name: "Me — collector"
  type: persona               # organization | individual | persona
  description: >
    A collector with specific taste. Relevance is judged against what I'd
    actually want to know about, buy, or track — not the market at large.
  relationship_to_subject: collector   # competitor | buyer | builder | collector | investor | ...
  # Seeds that DESCRIBE the anchor. For a persona this is taste; for an org it's
  # the division page, representative papers, recent awards, capability blurbs.
  seeds:
    taste:
      likes: ["integrated-bracelet sport watches", "in-house movements",
              "independent watchmakers", "sub-$2k microbrands with real finishing"]
      dislikes: ["homage/clone designs", "oversized fashion pieces"]
      owns: ["<optional: list a few to sharpen the model>"]
      watchlist: ["<brands/refs I'm actively tracking>"]
  # ---- populated by bootstrap, then human-edited. THIS is the relevance
  #      lattice: what this anchor cares about + what counts as a signal. ----
  derived:
    interests: []             # inferred from seeds + research
    peer_or_competitive_set: []   # collector: comparable brands/segments
                                  # org: actual competitors
    counterparties: []        # who they buy from / sell to / watch
    signal_definitions:       # what makes something matter to THIS anchor
      opportunity: null       # collector: a tracked ref dropping in price; new indie release
      threat: null            # org: a competitor award in your exact wheelhouse
      shift: null             # structural change worth flagging
    last_bootstrapped: null
    confidence_notes: null

relevance:
  # The scoring rubric `monitor` applies to each candidate item. Derived from the
  # anchor profile by bootstrap, then calibrated against examples YOU grade.
  threshold: 0.6              # 0..1; items below this are dropped silently
  rubric: null                # populated by bootstrap; human-editable
  calibration:                # your graded examples — single biggest quality lever
    relevant: []              # things you'd want surfaced (+ one line: why)
    not_relevant: []          # near-misses you'd want filtered (+ why)

monitoring:
  cadence:
    # The pattern that gets read instead of muted:
    daily:  { mode: terse,  send_if_empty: false }   # silent on "nothing material"
    weekly: { mode: digest, day: Mon, time: "07:00" }
    # NOTE: cadence shapes the agent's behavior (mode/send_if_empty), but the actual
    # run *times* live in the launchd plists (bin/install-launchd.sh) -- editing the
    # day/time here does not reschedule anything; change the plists for that.
  lookback_hours: 30          # small overlap so runs don't leave gaps
  state_file: ./state/seen.jsonl    # longitudinal memory -> dedup + "is this NEW?"
  # Reliability knobs (read by bin/monitor.sh; all optional with sane defaults):
  run_timeout_seconds: 1800   # wall-clock cap on a single claude run so a stall
                              # can't hang the job (0 = no limit; needs timeout/gtimeout)
  state_max_lines: 5000       # cap on state/seen.jsonl length; pruned each run so
                              # dedup stays fast and it can't grow forever (0 = off)
  # Deep-dive pass (only when models.deepdive is set): which triage survivors get
  # the expensive second-pass investigation + corroboration.
  deepdive_threshold: 0.85    # only items scoring >= this are investigated (keep high)
  deepdive_max_items: 5       # cap how many per run (cost guard)
  dedup:
    by: [url, title_fuzzy]    # don't re-surface the same story reworded
    fuzzy_threshold: 0.85
  # Tuning aids — surface near-misses while calibrating the rubric. See the
  # "Considered (below threshold)" appendix in monitor-prompt.md.
  show_borderline: true     # tuning aid: surface near-miss items below threshold
  borderline_band: 0.2      # how far below threshold counts as a near-miss

tracking:
  # Longitudinal trend detection — the "monitoring -> intelligence" layer. Each run
  # the monitor records observations (a metric value, or a recurring event) per
  # entity into state/observations.jsonl, then surfaces what CHANGED (deltas,
  # streaks, spikes) in a "What changed" section — not just brand-new items.
  enabled: true
  # The agent auto-tracks entities from the approved profile (anchor watchlist +
  # subject key players) and anything else it judges material. Pin must-track
  # entities + metrics here so coverage is guaranteed (optional; read by the agent):
  watch:
    - { entity: "Tudor Black Bay 58", metrics: ["secondary_price_usd", "new_listings"] }
    # - { entity: "<brand or ref>",   metrics: ["mention_count", "price_usd"] }
  # Sensitivity. Like show_borderline, start sensitive while calibrating, then
  # tighten. A change is flagged when it crosses ANY of these:
  min_pct_change: 8         # a tracked metric moved >= this % vs its last observation
  repeat_streak: 2          # >= this many related events for one entity in the window
  mention_spike_factor: 2.0 # mentions >= this multiple of the entity's trailing baseline
  label_confidence: true    # tag each change high/medium/low while you're tuning
  observations_max_lines: 20000   # cap state/observations.jsonl; pruned each run (0 = off)

output:
  # Reports always land in kb/. Set email_to to ALSO email each report via msmtp
  # (install msmtp + configure ~/.msmtprc — see the README). Leave it blank or
  # remove it to skip email and just read reports from kb/. The same switch makes
  # bootstrap email a "profile draft ready for review" summary (approval stays the
  # local `cp profile.draft.yaml profile.yaml`).
  email_to: ""                # e.g. "you@example.com"; blank = no email
  knowledge_base: ./kb/       # accumulate over time; don't just email into the void
  dashboard: true             # regenerate kb/index.html each run (tracked entities +
                              # sparklines + report links); set false to skip
  # NOTE: the distribution list below is documentation only — it sketches the
  # intended multi-channel shape (file/slack/telegram/discord). Only email_to
  # above is wired today; editing these entries has no effect.
  distribution:
    - { type: email, to: "me@example.com" }   # or: file, slack, telegram, discord
    - { type: file,  path: "./kb/{{date}}.md" }

governance:
  # Human-in-the-loop. Also your clean story when you take this to the gov group.
  require_profile_review: true     # monitor won't run until derived blocks are approved
  profile_refresh_days: 30         # anchors drift; re-bootstrap on a slow cadence
  flag_low_confidence: true        # surface the agent's own uncertainty for review
