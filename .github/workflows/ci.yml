name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Run on macOS too: the agents deploy on a macOS mini, so this is the only leg
    # that exercises the BSD coreutils (date/sed/stat/ps) the conventions target —
    # an all-Ubuntu matrix would never catch a GNU-vs-BSD divergence.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # shellcheck, jq, and python3 are preinstalled on both runner images.
      - name: shellcheck
        run: shellcheck bin/*.sh tests/run.sh

      - name: syntax check (bash -n)
        run: |
          for f in bin/*.sh tests/run.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: python compile check
        run: python3 -m py_compile bin/*.py

      - name: unit tests
        run: bash tests/run.sh
